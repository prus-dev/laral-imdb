name: Auto-enable PR automerge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Enable automerge when PR has no conflicts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            // mergeable can be null until GitHub finishes computing it.
            for (let attempt = 1; attempt <= 6; attempt++) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number,
              });

              if (pr.mergeable !== null) {
                if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                  core.info(`PR #${pull_number} has conflicts. Skipping automerge.`);
                  return;
                }

                const prNodeId = pr.node_id;

                try {
                  await github.graphql(
                    `mutation EnableAutoMerge($pullRequestId: ID!) {
                      enablePullRequestAutoMerge(input: {
                        pullRequestId: $pullRequestId,
                        mergeMethod: SQUASH
                      }) {
                        pullRequest {
                          number
                        }
                      }
                    }`,
                    { pullRequestId: prNodeId },
                  );

                  core.info(`Automerge enabled for PR #${pull_number}.`);
                } catch (error) {
                  core.warning(`Could not enable automerge for PR #${pull_number}: ${error.message}`);
                }

                return;
              }

              core.info(`mergeable is null (attempt ${attempt}/6). Waiting 10 seconds...`);
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            core.warning(`Timed out waiting for PR #${pull_number} mergeability result.`);
